name: Build & Deploy Next.js to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Verify the app compiles in CI (catches broken main before touching the VPS).
      - name: Install dependencies
        run: npm ci

      - name: Build (CI check)
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build

      # Stop the live app BEFORE rsync. With --delete, a live next start process
      # can serve HTML that still points at chunk files already removed mid-sync
      # → "Failed to load chunk /_next/static/chunks/...".
      - name: Stop PM2 app on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            pm2 stop next-app || true

      # Sync source only — do NOT ship CI's .next. Rebuilding on the VPS keeps
      # server HTML and /_next/static chunks on the same BUILD_ID.
      - name: Deploy source to VPS via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude=".git"
            --exclude="node_modules"
            --exclude=".next"
            --exclude=".env"
            --exclude=".env.local"
            --exclude=".env.*.local"
          path: ./
          remote_path: /home/${{ secrets.VPS_USER }}/apps/site/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install, build & restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.VPS_USER }}/apps/site"
            cd "$APP_DIR"

            npm ci

            # Keep production env on the VPS in .env.production or .env —
            # do not rely on CI shipping .env files.
            if [ -f .env.production ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env.production
              set +a
            elif [ -f .env ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env
              set +a
            fi

            npm run build

            # Full restart so PM2 does not keep a stale next process / cwd.
            pm2 delete next-app || true
            pm2 start npm --name next-app -- start -- --port=4000
            pm2 save
